<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#102749">
  <meta name="apple-mobile-web-app-title" content="奥特曼乐园">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="选一个奥特曼，和光之英雄一起变身、练招！适合亲子游玩的触控小游戏。">
  <title>奥特曼 · 招式乐园</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23102749'/%3E%3Cpath d='M36 5 14 36h16l-3 23 24-34H35z' fill='%23ffcf59'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png">
  <link rel="preload" as="image" href="./assets/sprites/ultra-atlas-v2.webp" fetchpriority="high">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="game" class="game" inert>
  <section class="arena" aria-label="奥特曼招式舞台">
    <canvas id="stage" role="img" aria-label="迪迦在光之舞台上准备出招"></canvas>
    <p id="speech" class="speech" role="status" aria-live="polite" hidden></p>
    <div id="countdown" class="countdown" hidden></div>
    <div class="hero-title"><span id="hero-subtitle" hidden></span><strong id="hero-name">迪迦</strong><span id="phase" hidden></span></div>
    <button id="monster" class="monster-button" aria-label="哥莫拉，点击换怪兽"><canvas aria-hidden="true"></canvas><strong>哥莫拉</strong><span class="cycle-icon" aria-hidden="true">↻</span></button>
    <div id="monster-health" class="monster-health" role="progressbar" aria-label="怪兽血量" aria-valuemin="0" aria-valuemax="4" aria-valuenow="4"><i></i><i></i><i></i><i></i></div>
    <div class="scenes" aria-label="选择场景"><button data-scene="0" aria-label="城市" aria-pressed="true">🏙</button><button data-scene="1" aria-label="宇宙" aria-pressed="false">🪐</button><button data-scene="2" aria-label="峡谷" aria-pressed="false">🏜</button></div>
    <div id="move-progress" class="move-progress"></div>
  </section>
  <section class="controls" aria-label="选择奥特曼和招式">
    <div class="hero-selection"><div id="heroes" class="heroes"></div></div>
    <div class="move-selection"><div class="moves">
<button data-move="entrance" class="move entrance"><span>✦</span><strong>变身</strong></button>
<button data-move="punch" class="move fight"><span>✊</span><strong>连环拳</strong></button>
<button data-move="fight" class="move fight"><span>🦶</span><strong id="fight-label">飞踢</strong></button>
<button data-move="uppercut" class="move fight"><span>☄</span><strong>升龙拳</strong></button>
<button data-move="spin" class="move entrance"><span>🌀</span><strong>旋风踢</strong></button>
<button data-move="shield" class="move special"><span>🛡</span><strong>光之盾</strong></button>
<button data-move="special" class="move special"><span>ϟ</span><strong id="special-label">光线</strong></button>
<button data-move="ultimate" class="move ultimate"><span>🌟</span><strong>超级必杀</strong></button>
</div></div>
  </section>
</main>
<section id="welcome" class="welcome" aria-label="开始游戏">
  <div class="welcome-stars">✦ <span>✧</span> ✦</div>
  <div class="squad" aria-hidden="true"><canvas></canvas><canvas></canvas><canvas></canvas><canvas></canvas></div>
  <button id="start" class="start-button" disabled><span>▶</span> <strong>准备中…</strong></button><p id="loading" role="status">奥特曼正在集合</p><button id="retry" hidden>重新加载</button>
</section>
<noscript>请开启浏览器 JavaScript 后再玩。</noscript>
<script type="module" src="./pwa.js"></script>
<script type="module" src="./game.js"></script>
</body>
</html>
